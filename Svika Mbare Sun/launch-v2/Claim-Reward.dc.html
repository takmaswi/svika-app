<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Svika claim reward</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600;9..40,700;9..40,800&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pop{animation:pop .6s cubic-bezier(.2,.8,.3,1) .1s both}
.r{animation:rise .5s cubic-bezier(.2,.8,.3,1) both}
button:active,a:active{transform:scale(0.98)}
@media (prefers-reduced-motion: reduce){.pop,.r{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 360px; height: 780px; box-sizing: border-box; background: #F5B301; overflow: hidden; font-family: 'IBM Plex Sans', sans-serif; color: #161D18">

<div style="padding: 36px 22px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<span class="pop" style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 64px; line-height: 1; background: #161D18; color: #F5B301; border-radius: 26px; padding: 18px 26px">$5</span>
<h1 style="margin: 8px 0 0; font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.035em">You won this week</h1>
<span style="font-size: 14px; line-height: 1.45; color: rgba(22,29,24,.8); max-width: 270px">Your fixes and fares helped the most riders. Thank you.</span>
</div>

<div class="r" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -16px 40px rgba(22,29,24,.2); padding: 22px 18px 24px; display: flex; flex-direction: column; gap: 16px; animation-delay: .2s">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600">EcoCash number to pay</span>
<span style="display: flex; align-items: center; height: 56px; border-radius: 16px; border: 2px solid #1F4D2E; padding: 0 16px; gap: 10px">
<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 16px; color: #575F53">+263</span>
<input inputmode="numeric" placeholder="77 000 0000" style="flex: 1; border: none; outline: none; font: 600 16px 'IBM Plex Mono', monospace; color: #161D18; background: transparent">
</span>
</label>
<div style="display: flex; gap: 10px; background: #F4F5F1; border-radius: 16px; padding: 12px 14px">
<span style="width: 28px; height: 28px; border-radius: 9px; background: #161D18; color: #F5B301; display: flex; align-items: center; justify-content: center; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"></path></svg></span>
<span style="font-size: 12.5px; line-height: 1.45">We use this number only to send your $5. Only the Svika team can see it, and we delete it 90 days after paying.</span>
</div>
<button style="min-height: 58px; border: none; border-radius: 999px; padding: 9px 10px 9px 22px; background: #1F4D2E; box-shadow: 0 10px 26px rgba(31,77,46,.30); color: #FFFFFF; display: flex; align-items: center; justify-content: space-between; font: 600 16px 'IBM Plex Sans', sans-serif; cursor: pointer">
<span>Claim my $5</span>
<span style="width: 40px; height: 40px; border-radius: 999px; background: #F5B301; color: #161D18; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 10.1c0-.72.58-1.3 1.3-1.3H12V6.1c0-1.28 1.5-1.94 2.42-1.05l6.28 6.05c.6.58.6 1.54 0 2.12l-6.28 6.05C13.5 20.16 12 19.5 12 18.22V15.5H5.3A1.3 1.3 0 0 1 4 14.2z"></path></svg></span>
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
