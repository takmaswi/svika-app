<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Svika fix it sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600;9..40,700;9..40,800&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.up{animation:up .26s cubic-bezier(.2,.8,.3,1) both}
button:active,a:active{transform:scale(0.98)}
@media (prefers-reduced-motion: reduce){.up{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 360px; height: 780px; box-sizing: border-box; background: #F4F5F1; overflow: hidden; font-family: 'IBM Plex Sans', sans-serif; color: #161D18">
<div style="position: absolute; inset: 0; background: rgba(22,29,24,.45)"></div>

<div class="up" role="dialog" aria-label="Fix this rank" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -16px 40px rgba(22,29,24,.25); padding: 10px 18px 24px; display: flex; flex-direction: column; gap: 16px">
<span style="align-self: center; width: 38px; height: 4px; border-radius: 999px; background: rgba(22,29,24,.16)"></span>
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.03em">What needs fixing?</h2>
<span style="font-size: 13px; color: #575F53">Copacabana. Your fix goes to a person who checks it before it changes.</span>
</div>

<div role="radiogroup" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="6">
<button role="radio" aria-checked="{{o.on}}" style="min-height: 64px; border-radius: 16px; border: {{o.border}}; background: {{o.bg}}; padding: 10px 12px; text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 2px; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif; color: #161D18">
<span style="font-size: 14px; font-weight: 600">{{o.t}}</span>
<span style="font-size: 11.5px; color: #575F53">{{o.s}}</span>
</button>
</sc-for>
</div>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 10.5px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: #575F53">Correct name</span>
<input value="Copacabana Rank" style="height: 52px; border-radius: 14px; border: 2px solid #1F4D2E; padding: 0 14px; font: 600 16px 'IBM Plex Sans', sans-serif; color: #161D18; outline: none">
</label>
<div style="display: flex; align-items: center; gap: 10px; background: #D9E8CC; border-radius: 14px; padding: 10px 12px">
<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; color: #143D22">3</span>
<span style="font-size: 12.5px; color: #143D22">riders suggested something similar. Yours joins theirs.</span>
</div>

<button style="min-height: 58px; border: none; border-radius: 999px; padding: 9px 10px 9px 22px; background: #1F4D2E; box-shadow: 0 10px 26px rgba(31,77,46,.30); color: #FFFFFF; display: flex; align-items: center; justify-content: space-between; font: 600 16px 'IBM Plex Sans', sans-serif; cursor: pointer">
<span>Send fix</span>
<span style="width: 40px; height: 40px; border-radius: 999px; background: #F5B301; color: #161D18; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 10.1c0-.72.58-1.3 1.3-1.3H12V6.1c0-1.28 1.5-1.94 2.42-1.05l6.28 6.05c.6.58.6 1.54 0 2.12l-6.28 6.05C13.5 20.16 12 19.5 12 18.22V15.5H5.3A1.3 1.3 0 0 1 4 14.2z"></path></svg></span>
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
renderVals() {
const on = { border: '2px solid #1F4D2E', bg: '#D9E8CC', on: 'true' };
const off = { border: '2px solid transparent', bg: '#F4F5F1', on: 'false' };
return {
opts: [
{ t: 'Name or spelling', s: 'Wrong or misspelt', ...on },
{ t: 'Location', s: 'Move the pin', ...off },
{ t: 'Destinations', s: 'Where kombis go', ...off },
{ t: 'Fare', s: 'What you paid', ...off },
{ t: 'Rank closed', s: 'No kombis here now', ...off },
{ t: 'Missing rank', s: 'Add one nearby', ...off }
]
};
}
}
</script>
</body>
</html>
