@keyframes beam{0%,100%{opacity:.6}50%{opacity:1}}

.r{animation:rise .55s cubic-bezier(.2,.8,.3,1) both}

.bob{animation:bob 2.4s ease-in-out infinite}
.beam{animation:beam 2.8s ease-in-out infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
button:active,a:active{transform:scale(0.98)}
@media (prefers-reduced-motion: reduce){.r,.drive,.bob,.beam,.pulse{animation:none}}
