<style>
body{margin:0}
a{color:#1F4D2E}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes grow{from{width:0}}
.r{animation:rise .55s cubic-bezier(.2,.8,.3,1) both}
.bob{animation:bob 2.4s ease-in-out infinite}
.grow{animation:grow 1s cubic-bezier(.2,.8,.3,1) .6s both}
button:active,a:active{transform:scale(0.98)}
@media (prefers-reduced-motion: reduce){.r,.bob,.grow{animation:none}}
</style>
</helmet>

</header>
<div class="r" style="margin-top: 20px; display: flex; flex-direction: column; gap: 12px; animation-delay: .08s">

</div>
</div>
</div>

</span>

<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 20px; color: #F5B301">$1.50</span>

</span>

</button>

<div class="r" style="padding: 14px 16px 0; animation-delay: .24s">

<span style="font-size: 15px; font-weight: 600; color: #161D18">Somewhere new?</span>

<section class="r" style="padding: 18px 16px 0; display: flex; flex-direction: column; gap: 8px; animation-delay: .3s">

<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 56px; text-decoration: none; color: #161D18">

<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14.5px; font-weight: 600">{{t.to}}</span><span style="font-size: 12px; color: #575F53">{{t.when}}</span></span>
<span style="font-size: 13px; font-weight: 600; color: #1F4D2E">Repeat</span>
</a>
</sc-for>
</section>

<section class="r" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 12px 16px 0; animation-delay: .38s">
<div style="background: #D9E8CC; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 6px; color: #143D22">
<span style="font-size: 10.5px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase">This week</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 28px; line-height: 1">14</span>
<span style="font-size: 12px; line-height: 1.35">riders used your fixes and fares</span>
</div>
<a href="#" style="background: #FFFFFF; border-radius: 22px; box-shadow: 0 10px 26px rgba(22,29,24,.10); padding: 14px; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: #161D18">
<span style="font-size: 10.5px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: #575F53">Weekly reward</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 28px; line-height: 1">$5</span>

<span class="bob" style="position: absolute; right: 70px; top: 26px; width: 24px; height: 24px; border-radius: 8px; background: #F5B301; border: 2.5px solid #FFFFFF; box-sizing: border-box; filter: drop-shadow(0 0 10px rgba(245,179,1,.55))"></span>
<span style="position: relative; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: #161D18; background: #F5B301; border-radius: 999px; padding: 3px 9px; align-self: flex-start">Coming soon</span>
<span style="font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 15px; color: #FFFFFF">Your kombi, live on the map</span>
