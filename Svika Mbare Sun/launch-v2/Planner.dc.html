<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Svika planner</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600;9..40,700;9..40,800&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1F4D2E}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
.r{animation:rise .45s cubic-bezier(.2,.8,.3,1) both}
.caret{animation:blink 1s steps(1) infinite}
button:active,a:active{transform:scale(0.98)}
@media (prefers-reduced-motion: reduce){.r,.caret{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 360px; height: 780px; box-sizing: border-box; background: #FFFFFF; overflow: hidden; font-family: 'IBM Plex Sans', sans-serif; color: #161D18">

<div style="background: #F5B301; padding: 16px 16px 20px; border-radius: 0 0 28px 28px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="#" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: rgba(22,29,24,.10); color: #161D18; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 10.1c0-.72-.58-1.3-1.3-1.3H12V6.1c0-1.28-1.5-1.94-2.42-1.05L3.3 11.1c-.6.58-.6 1.54 0 2.12l6.28 6.05C10.5 20.16 12 19.5 12 18.22V15.5h6.7a1.3 1.3 0 0 0 1.3-1.3z"></path></svg></a>
<h1 style="margin: 0; font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.03em">Plan a trip</h1>
</div>
<div style="background: #FFFFFF; border-radius: 20px; box-shadow: 0 12px 28px rgba(22,29,24,.16); padding: 4px 14px; display: flex; flex-direction: column">
<label style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid rgba(22,29,24,.08)">
<span style="width: 10px; height: 10px; border-radius: 999px; background: #1F4D2E; box-shadow: 0 0 0 4px #D9E8CC; flex: none"></span>
<span style="display: flex; flex-direction: column; flex: 1">
<span style="font-size: 10.5px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: #575F53">From</span>
<input value="My location" aria-label="From" style="border: none; outline: none; padding: 0; font: 600 16px 'IBM Plex Sans', sans-serif; color: #161D18; background: transparent">
</span>
<button aria-label="Swap From and To" style="width: 44px; height: 44px; border: none; border-radius: 999px; background: #F4F5F1; color: #161D18; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v15M3.5 7.5 7 4l3.5 3.5M17 20V5M13.5 16.5 17 20l3.5-3.5"></path></svg></button>
</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 56px">
<span style="width: 10px; height: 10px; border-radius: 3px; background: #161D18; flex: none"></span>
<span style="display: flex; flex-direction: column; flex: 1">
<span style="font-size: 10.5px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: #1F4D2E">To</span>
<span style="font: 600 16px 'IBM Plex Sans', sans-serif">Avon<span class="caret" style="display: inline-block; width: 2px; height: 18px; background: #1F4D2E; vertical-align: -3px; margin-left: 1px"></span></span>
</span>
</label>
</div>
</div>

<div style="padding: 18px 16px 0; display: flex; flex-direction: column; gap: 18px">

<section class="r" style="display: flex; flex-direction: column; gap: 4px; animation-delay: .05s">
<span style="font-size: 10.5px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: #575F53; padding: 0 4px 6px">Places</span>
<sc-for list="{{places}}" as="p" hint-placeholder-count="2">
<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 8px; border-radius: 16px; text-decoration: none; color: #161D18">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #D9E8CC; color: #1F4D2E; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5a7.5 7.5 0 0 1 7.5 7.5c0 5.2-5.9 10.6-6.6 11.2a1.4 1.4 0 0 1-1.8 0C10.4 20.6 4.5 15.2 4.5 10A7.5 7.5 0 0 1 12 2.5zm0 4.5a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column">
<span style="font-size: 15px; font-weight: 600"><b style="font-weight: 700">Avon</b>{{p.rest}}</span>
<span style="font-size: 12px; color: #575F53">{{p.meta}}</span>
</span>
</a>
</sc-for>
</section>

<section class="r" style="display: flex; flex-direction: column; gap: 4px; animation-delay: .12s">
<span style="font-size: 10.5px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: #575F53; padding: 0 4px 6px">Recent</span>
<sc-for list="{{recent}}" as="p" hint-placeholder-count="2">
<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 8px; border-radius: 16px; text-decoration: none; color: #161D18">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #F4F5F1; color: #575F53; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg></span>
<span style="flex: 1; font-size: 15px; font-weight: 600">{{p}}</span>
</a>
</sc-for>
</section>

<div class="r" style="display: flex; gap: 12px; align-items: center; background: #F4F5F1; border-radius: 18px; padding: 14px; animation-delay: .2s">
<span style="width: 36px; height: 36px; border-radius: 999px; background: #161D18; color: #F5B301; display: flex; align-items: center; justify-content: center; flex: none; font: 700 13px 'DM Sans', sans-serif">Aa</span>
<span style="font-size: 13px; line-height: 1.45; color: #161D18">Not sure of the name? Type it how you say it, in Shona or English. <b>Ndoda kuenda kuAvondale</b> works too.</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
renderVals() {
return {
places: [
{ rest: 'dale', meta: 'Suburb, Harare' },
{ rest: 'dale Shops', meta: 'Shops, King George Rd' }
],
recent: ['UZ', "Sam Levy's"]
};
}
}
</script>
</body>
</html>
