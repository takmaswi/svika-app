<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Svika end of trip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600;9..40,700;9..40,800&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1F4D2E}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.up{animation:up .26s cubic-bezier(.2,.8,.3,1) both}
.pop{animation:pop .5s cubic-bezier(.2,.8,.3,1) .2s both}
button:active,a:active{transform:scale(0.98)}
@media (prefers-reduced-motion: reduce){.up,.pop{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 360px; height: 780px; box-sizing: border-box; background: #F5B301; overflow: hidden; font-family: 'IBM Plex Sans', sans-serif; color: #161D18">

<div style="padding: 40px 22px 0; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<span class="pop" style="width: 76px; height: 76px; border-radius: 999px; background: #161D18; color: #F5B301; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7.5"></path></svg></span>
<h1 style="margin: 0; font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.035em">You made it</h1>
<span style="font-size: 14px; color: rgba(22,29,24,.8)">Two quick taps help the next rider.</span>
</div>

<div class="up" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -16px 40px rgba(22,29,24,.2); padding: 22px 18px 24px; display: flex; flex-direction: column; gap: 20px">

<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 17px; padding: 0 0 10px">Did you board at Market Square?</legend>
<div style="display: flex; gap: 8px">
<button aria-pressed="true" style="flex: 1; min-height: 52px; border-radius: 16px; border: 2px solid #1F4D2E; background: #D9E8CC; font: 600 15px 'IBM Plex Sans', sans-serif; color: #143D22; cursor: pointer">Yes</button>
<button aria-pressed="false" style="flex: 1.6; min-height: 52px; border-radius: 16px; border: 2px solid transparent; background: #F4F5F1; font: 600 15px 'IBM Plex Sans', sans-serif; color: #161D18; cursor: pointer">A different rank</button>
</div>
</fieldset>

<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 17px; padding: 0 0 10px">What did you pay?</legend>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{fares}}" as="f" hint-placeholder-count="4">
<button aria-pressed="{{f.on}}" style="min-height: 52px; border-radius: 16px; border: {{f.border}}; background: {{f.bg}}; font: 600 15px 'IBM Plex Mono', monospace; color: #161D18; cursor: pointer">{{f.v}}</button>
</sc-for>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 6px">
<button style="min-height: 58px; border: none; border-radius: 999px; padding: 9px 10px 9px 22px; background: #1F4D2E; box-shadow: 0 10px 26px rgba(31,77,46,.30); color: #FFFFFF; display: flex; align-items: center; justify-content: space-between; font: 600 16px 'IBM Plex Sans', sans-serif; cursor: pointer">
<span>Send</span>
<span style="width: 40px; height: 40px; border-radius: 999px; background: #F5B301; color: #161D18; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 10.1c0-.72.58-1.3 1.3-1.3H12V6.1c0-1.28 1.5-1.94 2.42-1.05l6.28 6.05c.6.58.6 1.54 0 2.12l-6.28 6.05C13.5 20.16 12 19.5 12 18.22V15.5H5.3A1.3 1.3 0 0 1 4 14.2z"></path></svg></span>
</button>
<a href="#" style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; text-decoration: none; color: #575F53">Skip</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
renderVals() {
const off = { border: '2px solid transparent', bg: '#F4F5F1', on: 'false' };
return {
fares: [
{ v: '$1', ...off },
{ v: '$1.50', border: '2px solid #1F4D2E', bg: '#D9E8CC', on: 'true' },
{ v: '$2', ...off },
{ v: 'Other', ...off }
]
};
}
}
</script>
</body>
</html>
