<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Svika admin verify queue</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600;9..40,700;9..40,800&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.r{animation:rise .5s cubic-bezier(.2,.8,.3,1) both}
button:active,a:active{transform:scale(0.98)}
@media (prefers-reduced-motion: reduce){.r{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 360px; height: 800px; box-sizing: border-box; background: #F4F5F1; overflow: hidden; font-family: 'IBM Plex Sans', sans-serif; color: #161D18; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px">

<header style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column">
<span style="font-size: 10.5px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: #575F53">Admin</span>
<h1 style="margin: 0; font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.03em">Verify fixes</h1>
</div>
<span style="height: 36px; padding: 0 12px; border-radius: 999px; background: #161D18; color: #F5B301; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600"><span style="font-family: 'IBM Plex Mono', monospace">12</span> waiting</span>
</header>

<div role="tablist" style="display: flex; gap: 6px">
<button role="tab" aria-selected="true" style="height: 40px; padding: 0 14px; border: none; border-radius: 999px; background: #FFFFFF; box-shadow: 0 4px 12px rgba(22,29,24,.08); font: 600 13px 'IBM Plex Sans', sans-serif; color: #161D18">Names</button>
<button role="tab" aria-selected="false" style="height: 40px; padding: 0 14px; border: none; border-radius: 999px; background: transparent; font: 600 13px 'IBM Plex Sans', sans-serif; color: #575F53">Locations</button>
<button role="tab" aria-selected="false" style="height: 40px; padding: 0 14px; border: none; border-radius: 999px; background: transparent; font: 600 13px 'IBM Plex Sans', sans-serif; color: #575F53">Fares</button>
<button role="tab" aria-selected="false" style="height: 40px; padding: 0 14px; border: none; border-radius: 999px; background: transparent; font: 600 13px 'IBM Plex Sans', sans-serif; color: #575F53">New</button>
</div>

<article class="r" style="background: #FFFFFF; border-radius: 22px; box-shadow: 0 10px 28px rgba(22,29,24,.10); padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 10.5px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: #575F53">Name, kombi rank, Harare</span>
<span style="font-size: 12px; font-weight: 600; color: #1F4D2E; background: #D9E8CC; border-radius: 999px; padding: 4px 10px"><span style="font-family: 'IBM Plex Mono', monospace">3</span> riders agree</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="background: #F4F5F1; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: #575F53">Now</span>
<span style="font-size: 14px; font-weight: 600; text-decoration: line-through; text-decoration-color: rgba(22,29,24,.4)">Copacabana Bus Terminus</span>
</div>
<div style="background: #161D18; color: #FFFFFF; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: #F5B301">Suggested</span>
<span style="font-size: 14px; font-weight: 600">Copacabana Rank</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: #575F53">Spellings riders sent, grouped as one</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; background: #F4F5F1; border-radius: 8px; padding: 6px 9px">Copacabana Rank</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; background: #F4F5F1; border-radius: 8px; padding: 6px 9px">Copa Cabana</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; background: #F4F5F1; border-radius: 8px; padding: 6px 9px">Coppa Cabana</span>
</div>
</div>
<div style="height: 96px; border-radius: 14px; background: #F4F5F1; position: relative; overflow: hidden">
<svg width="100%" height="96" viewBox="0 0 296 96" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path d="M-10 60 L 310 46" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"></path><path d="M120 -10 L 132 110" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"></path><circle cx="128" cy="52" r="7" fill="#E84C30" stroke="#FFFFFF" stroke-width="3"></circle></svg>
</div>
<div style="display: flex; gap: 8px">
<button style="flex: 1; min-height: 52px; border: none; border-radius: 999px; background: #F4F5F1; font: 600 14px 'IBM Plex Sans', sans-serif; color: #161D18; cursor: pointer">Reject</button>
<button style="flex: 1; min-height: 52px; border: none; border-radius: 999px; background: #F4F5F1; font: 600 14px 'IBM Plex Sans', sans-serif; color: #161D18; cursor: pointer">Edit</button>
<button style="flex: 1.4; min-height: 52px; border: none; border-radius: 999px; background: #1F4D2E; box-shadow: 0 8px 20px rgba(31,77,46,.28); font: 600 14px 'IBM Plex Sans', sans-serif; color: #FFFFFF; cursor: pointer">Approve</button>
</div>
</article>

<article class="r" style="background: #FFFFFF; border-radius: 22px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; opacity: .85; animation-delay: .1s">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #F5B301; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px">$</span>
<span style="flex: 1; display: flex; flex-direction: column">
<span style="font-size: 14px; font-weight: 600">Fare at Charge Office</span>
<span style="font-size: 12px; color: #575F53">Next in queue</span>
</span>
</article>
<span style="font-size: 11.5px; color: #575F53; text-align: center">Nothing goes live until you approve it.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
